services:
  redis:
    image: redis:7-alpine
  db:
    image: postgis/postgis:16-3.4
    environment: {POSTGRES_PASSWORD: nowcast, POSTGRES_DB: nowcast}
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres"], interval: 3s, retries: 20}
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:nowcast@db:5432/nowcast
      REPLAY_SECONDS: "2"
      # SEVIR_ROOT: /sevir          # mount the AWS SEVIR download to use real data
      # WEBHOOK_URL: https://...    # alert webhook
    # volumes: ["./sevir:/sevir"]
    depends_on:
      redis: {condition: service_started}
      db: {condition: service_healthy}
